[package]
name = "dira"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Dira CLI: a thin control client over the daemon's Unix domain socket."

[[bin]]
name = "dira"
path = "src/main.rs"

[dependencies]
dira-core.workspace = true
dira-sources.workspace = true
dira-contract.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
anyhow.workspace = true
ulid.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures-util.workspace = true
toml_edit.workspace = true

[dev-dependencies]
# `config_cmd`'s round-trip test re-layers a written config.toml the same way
# `Config::load` does.
figment.workspace = true
# Mock-cloud test server for `device.rs`'s two-phase rotation tests (WP-B1b) —
# the same axum version `dirad` already runs in production, test-only here.
axum.workspace = true
# A successful two-phase rotation calls `dira_core::identity::promote_pending_key`,
# which installs the new key via the same keychain-or-meta-fallback path
# `dira_core::identity` uses in production. Mirrors
# `dira_core::identity::tests::use_mock_keychain` so these tests never touch
# the real OS keychain either.
keyring.workspace = true
keyring-core.workspace = true
