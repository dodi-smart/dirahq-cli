name: Build Release Artifacts

# Tags pushed by GITHUB_TOKEN don't re-trigger workflows, so we react to the
# Release workflow finishing rather than to the `v*` tag push. We then build
# the CLI binaries for the newest tag and attach them to its GitHub release.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (e.g. v1.2.3)"
        required: true
        type: string
      dry_run:
        description: "build + package only, skip every upload (release assets, checksums.txt, smoke)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Serialize runs for the same tag/commit so two dispatches (or a dispatch
# racing the automatic workflow_run trigger) never upload to the same
# release concurrently. The exact resolved tag is only known inside the
# `resolve` job, so this is a best-effort key computed at trigger time:
# `inputs.tag` pins it exactly for workflow_dispatch; `head_sha` pins it to
# the underlying commit for the automatic workflow_run path. `resolve`'s own
# idempotency check (skip if the release already has assets) is the actual
# correctness backstop.
concurrency:
  group: build-release-${{ inputs.tag || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  # Find the tag to build and whether its release still needs artifacts.
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      proceed: ${{ steps.pick.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pick tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            tag="$DISPATCH_TAG"
          else
            tag=$(git tag -l 'v*' --sort=-creatordate | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "No v* tag found — nothing to build."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Prerelease tags build exactly like stable ones (D-0013). This used to
          # hard-skip them on automatic runs to avoid billed runner minutes on a
          # private repo; the repo is public, every leg is GitHub-hosted (D-0015),
          # and GitHub-hosted minutes are free for public repositories.
          # The idempotency check below is now the only guard against rebuilding
          # a release that already has assets — keep it.
          # Only build for a tag that semantic-release actually published as a GitHub
          # Release. A bare tag with no Release object (e.g. the v0.1.0 baseline tag)
          # is not a real release — skip it so we never publish binaries prematurely.
          if ! gh release view "$tag" >/dev/null 2>&1 && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Tag $tag has no GitHub Release — not a published release, skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Idempotency: skip if this release already has archive assets -- .tar.gz for
          # the unix legs, .zip for the Windows legs (D-0010).
          count=$(gh release view "$tag" --json assets -q '[.assets[] | select((.name | endswith(".tar.gz")) or (.name | endswith(".zip")))] | length' 2>/dev/null || echo 0)
          if [ "${count:-0}" -gt 0 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Release $tag already has $count artifact(s) — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  # NOTE: there is deliberately no `check-runners` job any more (D-0015). The
  # org's Default runner group sets `allows_public_repositories: false`, so once
  # this repo went public GitHub stopped scheduling anything that asks for
  # `self-hosted,build` — the job queues forever rather than failing. The
  # fallback action could not save us: it picks by whether runners are online and
  # idle, which they are, and has no visibility into the group policy. Every leg
  # now names a GitHub-hosted runner directly.
  # musl is statically linked, so the build host's glibc floor is irrelevant — one binary
  # per Linux arch covers Alpine, containers, and old-glibc distros alike. That mattered
  # most while x86_64 built on a self-hosted runner of unknown, drifting glibc; it is a
  # weaker argument now that every leg is a pinned GitHub-hosted image, but the property
  # is what the artifact promises users, so it stands independent of the build host.
  # `universal-apple-darwin` is a lipo fat binary the upload
  # action builds itself (both rustup targets + `lipo -create`), so Apple Silicon and Intel
  # ship from one leg — no separate x86_64-apple-darwin leg needed. Both Windows legs now
  # build natively (D-0014): x86_64-pc-windows-msvc on `windows-latest`, and
  # aarch64-pc-windows-msvc on `windows-11-arm`. The cross-compile that used to cover arm64
  # worked fine — MSVC links a foreign arch from an x86_64 host with nothing beyond
  # `rustup target add` — but you cannot *execute* an arm64 binary on an x64 runner, so
  # arm64 shipped with no smoke coverage at all. Native building is what makes the arm64
  # smoke leg possible; the label only resolves because the repo is public.
  build:
    name: Build ${{ matrix.target }}
    needs: [resolve]
    if: needs.resolve.outputs.proceed == 'true'
    timeout-minutes: 45
    # Every leg names its runner directly — no self-hosted fallback (D-0015).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Was the one leg routed to the self-hosted pool, as the heaviest
          # compile. It is now plain `ubuntu-latest`: the org runner group
          # refuses public repositories, so asking for `self-hosted,build`
          # queues indefinitely instead of running (D-0015).
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cross: true
          - target: universal-apple-darwin
            runner: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
          # Native, not cross-compiled (D-0014) — `cross: false` here means the same
          # thing it does for the x86_64 leg: build for the host arch. The smoke matrix
          # has a matching windows-arm64 leg on the same runner label.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            cross: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      # Set up the Rust toolchain directly instead of via mise: the self-hosted
      # `build` runner (used for x86_64-linux-musl) doesn't ship rustup, so mise's
      # `rust = "stable"` silently no-ops and `cargo` goes missing. Install rustup
      # when absent and pin stable. Target rustup targets are added by whichever
      # of the two steps below applies to this leg — never here, so an empty
      # `rustup target add` invocation is never possible.
      - name: Set up Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
      # musl legs only: sets up the musl cross-linker/sysroot and runs
      # `rustup target add` itself. Deliberately explicit here rather than
      # letting the upload action fall through to `cross` on its own — that
      # path exists in its main.sh but is undocumented, and it pulls in
      # Docker, which the artifact every user downloads shouldn't depend on.
      - name: Set up musl cross toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      # Windows legs only. Since D-0014 both Windows targets build natively — x86_64 on
      # `windows-latest`, aarch64 on `windows-11-arm` — so in each case this is the
      # runner's own host triple and `rustup target add` is a harmless no-op. Kept
      # anyway: it costs nothing, and it is what makes a future Windows cross leg work
      # without anyone having to rediscover that MSVC needs no separate cross-linker or
      # sysroot (unlike the musl legs above).
      - name: Add Windows rustup target
        if: contains(matrix.target, 'windows')
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Build & upload binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: dira,dirad
          target: ${{ matrix.target }}
          archive: dira-${{ needs.resolve.outputs.version }}-$target
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          tar: unix
          zip: windows
          checksum: sha256
          dry-run: ${{ inputs.dry_run == true }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # Regression guard for #60. The CRT is linked statically via
      # .cargo/config.toml so the binaries run on a machine with no Visual C++
      # Redistributable. Nothing else can catch a regression here: every GitHub
      # Windows image ships the redistributable, so the smoke legs would stay
      # green while shipping a binary that dies at process start on a clean box.
      # Runs after the build step above, against the same compiled artifact it
      # packaged (present under target/ even on a dry run).
      - name: Windows binaries link the CRT statically
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($name in 'dira', 'dirad') {
            $exe = "target/${{ matrix.target }}/release/$name.exe"
            if (-not (Test-Path $exe)) { throw "expected $exe to exist after the build step" }
            # Import scan without dumpbin, which needs a VS dev shell to be on
            # PATH. Reading the PE as ASCII and looking for the import names is
            # enough to catch the dynamic-CRT case this guards against.
            $bytes = [IO.File]::ReadAllBytes($exe)
            $text  = [Text.Encoding]::ASCII.GetString($bytes)
            foreach ($dll in 'VCRUNTIME140', 'api-ms-win-crt-runtime') {
              if ($text -match [regex]::Escape($dll)) { $bad += "$name.exe imports $dll" }
            }
          }
          if ($bad) {
            throw "dynamic CRT detected -- these binaries need the VC++ Redistributable: $($bad -join '; ')"
          }
          Write-Host "both binaries are free of VCRUNTIME140 / api-ms-win-crt-* imports"

  # Attach the contract artifacts (schema + signing fixture) and both installers to the
  # release so the cloud repo's `just contract-pull` and
  # https://github.com/dodi-smart/dirahq-cli/releases/latest/download/{install.sh,install.ps1}
  # (permanent fallback URLs) all work with no sibling checkout.
  release-assets:
    name: Publish release assets
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.resolve.outputs.proceed == 'true' && inputs.dry_run != true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve.outputs.tag }}" \
            contract/attestation.schema.json \
            contract/testdata/signing-vector.json \
            contract/testdata/session-grouping-vector.json \
            install.sh \
            install.ps1 \
            --clobber

  # Human-facing convenience only — install.sh verifies each download against
  # its own per-asset .sha256 file, it never reads checksums.txt.
  checksums:
    name: Publish checksums.txt
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.resolve.outputs.proceed == 'true' && inputs.dry_run != true
    steps:
      - name: Aggregate per-asset checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          dir=$(mktemp -d)
          gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.sha256' --dir "$dir"
          # Deterministic, readable order; each .sha256 asset is already one
          # `sha256sum`-style line per archive built in that matrix leg.
          cat "$dir"/*.sha256 | sort -k2 > "$dir/checksums.txt"
          gh release upload "$tag" "$dir/checksums.txt" --repo "${{ github.repository }}" --clobber

  # The acceptance gate: install.sh, for real, against the just-built release,
  # on every platform shape it claims to support. GITHUB_TOKEN is what makes
  # this work while the repo is private (install.sh's authenticated asset
  # path). Runs on every manual dispatch and every stable release — the thing
  # that turns "the pipeline compiled" into "the pipeline actually installs".
  smoke:
    name: Smoke ${{ matrix.leg }}
    needs: [resolve, build]
    if: needs.resolve.outputs.proceed == 'true' && inputs.dry_run != true
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-x64
            runner: ubuntu-latest
          - leg: linux-arm64
            runner: ubuntu-24.04-arm
          # Alpine has neither curl, tar, nor jq by default, and no git
          # (actions/checkout falls back to the REST API for the file
          # download, which works fine without git).
          - leg: alpine
            runner: ubuntu-latest
            container: alpine:3.20
          - leg: macos-arm64
            runner: macos-latest
          # The only leg that proves the lipo fat binary actually contains a
          # working x86_64 slice. macos-13 has been fully retired (GitHub
          # deprecated it in Sept 2025, unsupported since Dec 2025) — the
          # current GitHub-hosted Intel macOS image is macos-15-intel.
          - leg: macos-intel
            runner: macos-15-intel
          # install.ps1, for real, against the just-built release. The caveat that
          # used to live here -- that this leg couldn't go green until the Rust-side
          # Windows target support reached a released tag -- is spent: v0.1.0 ships
          # it, and a diagnostic run on windows-latest confirmed install, both
          # binaries, the named-pipe transport, and the full daemon lifecycle
          # (start/status/update --check/restart/stop) all work. Treat a failure
          # here as real.
          - leg: windows-x64
            runner: windows-latest
          # arm64 Windows, natively (D-0014). Until this existed the arm64 zip shipped
          # with no execution coverage whatsoever -- an x64 runner can build it but
          # cannot run it. install.ps1 resolves the target from PROCESSOR_ARCHITECTURE
          # (ARM64 -> aarch64-pc-windows-msvc), so this leg exercises the arm64 artifact
          # without any leg-specific wiring; the Windows steps below key off
          # `runner.os == 'Windows'` and apply to both legs unchanged.
          - leg: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - name: Install curl, tar, jq (alpine has none of them by default)
        if: matrix.leg == 'alpine'
        run: apk add --no-cache curl tar jq
      - name: Install dira via install.sh and exercise it
        # Static `sh`, not `bash`: alpine has no bash, and the script bodies
        # below are already POSIX-`sh`-safe (no bashisms), so one shell works
        # identically everywhere. (`shell:` doesn't support the `matrix`
        # context anyway — only a fixed value or `github`/`env`/`vars`/`inputs`
        # contexts are allowed there.)
        # Skipped on Windows: install.sh is the POSIX installer, exercised by every
        # other leg here; the Windows leg below exercises install.ps1 instead.
        if: runner.os != 'Windows'
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRA_REPO: ${{ github.repository }}
          DIRA_VERSION: ${{ needs.resolve.outputs.version }}
          DIRA_BIN_DIR: ${{ runner.temp }}/dira-bin
        run: |
          sh ./install.sh
          export PATH="$DIRA_BIN_DIR:$PATH"
          test "$(dira --version | head -n1 | awk '{print $2}')" = "$DIRA_VERSION"
          dirad --version
          dira daemon start && dira daemon status
          # Resolves against the release we just published and must report
          # "up to date". Exits 0 even offline, so a network blip here is a
          # real failure signal, not flake.
          dira update --check
          dira daemon restart && dira daemon stop
      # Runs between install and uninstall, deliberately: the binary must
      # still be on disk to inspect it.
      - name: lipo -info proves both slices shipped in the universal binary
        if: runner.os == 'macOS'
        env:
          DIRA_BIN_DIR: ${{ runner.temp }}/dira-bin
        run: |
          info=$(lipo -info "$DIRA_BIN_DIR/dira")
          echo "$info"
          echo "$info" | grep -q x86_64
          echo "$info" | grep -q arm64
      # install.ps1's Windows counterpart to the "Install dira via install.sh" step
      # above. `shell: powershell` pins Windows PowerShell 5.1, install.ps1's actual
      # compatibility floor and the default host behind `irm | iex` -- not pwsh/Core,
      # which is a separate, newer binary that wouldn't catch a 5.1-only regression.
      - name: Install dira via install.ps1 and exercise it (windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRA_REPO: ${{ github.repository }}
          DIRA_VERSION: ${{ needs.resolve.outputs.version }}
          DIRA_BIN_DIR: ${{ runner.temp }}\dira-bin
        run: |
          $ErrorActionPreference = 'Stop'
          .\install.ps1
          # install.ps1 reports failure by throwing, so a non-zero exit code from a run
          # that did NOT throw means it leaked one from an ignored best-effort call. That
          # is invisible without this assertion: GitHub ends the step with
          # `exit $LASTEXITCODE`, so a leak fails the step at its very end with nothing in
          # the log pointing at the cause. See the uninstall step below.
          #
          # `Test-Path variable:` first, exactly as GitHub's own wrapper does it, because
          # `$null -ne 0` is TRUE in PowerShell: a script that ran no native command never
          # creates $LASTEXITCODE, so the bare comparison throws on a perfectly successful
          # install. This assertion shipped without the guard and did precisely that to
          # both windows legs of v0.1.1-develop.2 -- the same null trap the #58 note below
          # already warned about.
          if ((Test-Path variable:\LASTEXITCODE) -and $LASTEXITCODE -ne 0) {
            throw "install.ps1 leaked exit code $LASTEXITCODE"
          }
          $env:PATH = "$env:DIRA_BIN_DIR;$env:PATH"
          # Capture first, THEN assert. `dira --version` prints two lines, so
          # piping it straight into `Select-Object -First 1` satisfies the cmdlet
          # on line 1 and it stops the upstream pipeline. That terminates the
          # native process, and PowerShell reports the stopped pipeline as
          # $LASTEXITCODE = -1 -- so the old ordering threw even though the
          # command had succeeded and the version had parsed correctly.
          # Measured on windows-latest: reported=[0.1.0] with LASTEXITCODE=[-1].
          # Assigning to a variable first runs the process to completion; the
          # later Select-Object then operates on a plain string array, where
          # early termination means nothing. See #58.
          $versionOutput = & dira --version
          if ($LASTEXITCODE -ne 0) { throw "dira --version failed (exit $LASTEXITCODE)" }
          $reported = (($versionOutput | Select-Object -First 1) -split '\s+')[1]
          if ($reported -ne $env:DIRA_VERSION) { throw "dira --version reported '$reported', expected '$env:DIRA_VERSION'" }
          dirad --version
          if ($LASTEXITCODE -ne 0) { throw "dirad --version failed" }
          dira daemon start
          if ($LASTEXITCODE -ne 0) { throw "dira daemon start failed" }
          dira daemon status
          if ($LASTEXITCODE -ne 0) { throw "dira daemon status failed" }
          # Resolves against the release we just published and must report "up to
          # date". Exits 0 even offline, so a network blip here is a real failure
          # signal, not flake -- same rationale as the unix legs above.
          dira update --check
          if ($LASTEXITCODE -ne 0) { throw "dira update --check failed" }
          dira daemon restart
          if ($LASTEXITCODE -ne 0) { throw "dira daemon restart failed" }
          dira daemon stop
          if ($LASTEXITCODE -ne 0) { throw "dira daemon stop failed" }
      - name: Idempotent re-run, then uninstall
        # Static `sh`, not `bash`: alpine has no bash, and the script bodies
        # below are already POSIX-`sh`-safe (no bashisms), so one shell works
        # identically everywhere. (`shell:` doesn't support the `matrix`
        # context anyway — only a fixed value or `github`/`env`/`vars`/`inputs`
        # contexts are allowed there.)
        # Skipped on Windows: see "Idempotent re-run + uninstall (windows)" below.
        if: runner.os != 'Windows'
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRA_REPO: ${{ github.repository }}
          DIRA_VERSION: ${{ needs.resolve.outputs.version }}
          DIRA_BIN_DIR: ${{ runner.temp }}/dira-bin
        run: |
          export PATH="$DIRA_BIN_DIR:$PATH"
          # Re-running over an identical install is a no-op, exit 0.
          sh ./install.sh
          sh ./install.sh --uninstall
          ! command -v dira
      - name: Idempotent re-run + uninstall (windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRA_REPO: ${{ github.repository }}
          DIRA_VERSION: ${{ needs.resolve.outputs.version }}
          DIRA_BIN_DIR: ${{ runner.temp }}\dira-bin
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:DIRA_BIN_DIR;$env:PATH"
          # Re-running over an identical install is a no-op.
          .\install.ps1
          # `Test-Path variable:` first — see the note on the same assertion in the step
          # above. The "already installed, nothing to do" path returns before running any
          # native command, so this one hit the null trap too.
          if ((Test-Path variable:\LASTEXITCODE) -and $LASTEXITCODE -ne 0) {
            throw "install.ps1 (idempotent re-run) leaked exit code $LASTEXITCODE"
          }
          # Assert the exit code here rather than letting GitHub's trailing
          # `exit $LASTEXITCODE` decide the step's fate. This uninstall did its whole job
          # -- printed "removed dira and dirad", both Test-Path guards below stayed quiet --
          # and the step still failed 1, because `dira daemon uninstall` runs schtasks/reg,
          # whose "ERROR: nothing to remove" stderr tripped Windows PowerShell 5.1's
          # redirected-native-stderr rule under $ErrorActionPreference='Stop' and left
          # $LASTEXITCODE poisoned. Fixed in install.ps1's Invoke-BestEffort; asserted here
          # so a regression names itself instead of pointing at the end of the step.
          .\install.ps1 -Uninstall -Force
          if ((Test-Path variable:\LASTEXITCODE) -and $LASTEXITCODE -ne 0) {
            throw "install.ps1 -Uninstall leaked exit code $LASTEXITCODE"
          }
          if (Test-Path "$env:DIRA_BIN_DIR\dira.exe") { throw "dira.exe still present after -Uninstall" }
          if (Test-Path "$env:DIRA_BIN_DIR\dirad.exe") { throw "dirad.exe still present after -Uninstall" }
