[package]
name = "dirad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Dira resident daemon: ingress, session/idle accounting, store, signing, sync."

[lib]
name = "dirad"
path = "src/lib.rs"

[[bin]]
name = "dirad"
path = "src/main.rs"

[dependencies]
dira-core.workspace = true
dira-sources.workspace = true
dira-contract.workspace = true
dira-ipc.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
time.workspace = true
anyhow.workspace = true
fastrand.workspace = true
futures.workspace = true
libc.workspace = true

[dev-dependencies]
# Throwaway dirs for `zavet`'s activation-probe and capture tests.
tempfile.workspace = true
# `zavet::parse_guard_event` must never panic on arbitrary plugin input.
proptest.workspace = true
# `try_pending_key_flush`'s self-heal path calls
# `dira_core::identity::{load_pending_key,promote_pending_key}`, which now
# resolve the pending key's secret through the SAME keychain-or-meta-fallback
# ladder the active key uses. Mirrors `dira_core::identity::tests::use_mock_keychain`
# / `dira::test_support::use_mock_keychain` so these tests never touch the real
# OS keychain either.
keyring.workspace = true
keyring-core.workspace = true
