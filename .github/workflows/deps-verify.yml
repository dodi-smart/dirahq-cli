# Thin caller, copy to <repo>/.github/workflows/deps-verify.yml
#
# Set `stack` and, if the repo's commands differ from that stack's conventions,
# override them. There is no longer a template per stack: the previous Gradle
# variant had a specific product's task name baked into it, which is exactly the
# failure a copied template invites.
#
#   "@stack" (the default) = this stack's conventional command
#   ""                     = this repo has no such step
name: Dependency Verification
on:
  pull_request:
    # `labeled` is the safe manual re-run: apply `agent:review` to a Renovate PR.
    # Do NOT close/reopen one to re-trigger, Renovate reads a closed PR as
    # "don't want this update" and stops recreating it.
    types: [opened, synchronize, reopened, labeled]
  # PR Checks finishing starts verification again with its verdict ready, so no
  # job holds a runner while CI runs. `workflows:` must match the PR Checks
  # caller's `name:`; `branches:` keeps human PRs from creating runs at all.
  workflow_run:
    workflows: [PR Checks]
    types: [completed]
    branches: ['renovate/**', 'dependabot/**']
jobs:
  verify:
    # Cheap pre-filter: the shared workflow gates again, but this avoids a
    # hosted job start on every human push.
    if: >-
      (github.event_name == 'pull_request'
        && contains(fromJson('["renovate[bot]","app/renovate","dependabot[bot]"]'), github.event.pull_request.user.login)
        && (github.event.action != 'labeled' || github.event.label.name == 'agent:review'))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && !contains(fromJson('["cancelled","skipped"]'), github.event.workflow_run.conclusion))
    uses: dodi-smart/.github/.github/workflows/deps-verify.yml@v1
    secrets: inherit
    # The union of what the called workflow's jobs request. A caller has to grant
    # every one of them or the run fails at startup; add to this block when the
    # shared workflow adds a permission.
    permissions:
      contents: read
      pull-requests: write
      actions: write
      id-token: write
    with:
      stack: rust
      # Cargo resolves dependencies on demand, `cargo test` compiles every target,
      # and release binaries are build-release.yml's job (D-0015), so the only
      # step is the workspace tests.
      install: ""
      typecheck: ""
      build: ""
      test: cargo test --workspace
