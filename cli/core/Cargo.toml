[package]
name = "dira-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dira capture engine: event model, accounting FSM, project resolver, local store."

[dependencies]
dira-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
ulid.workspace = true
thiserror.workspace = true
tracing.workspace = true
figment.workspace = true
directories.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
serde_jcs.workspace = true
base64.workspace = true
keyring.workspace = true

[dev-dependencies]
# `figment::Jail` (env-isolated config tests) is gated behind its `test` feature.
figment = { workspace = true, features = ["test"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true }
criterion.workspace = true
# In-memory keyring store for tests (see `identity::tests::use_mock_keychain`).
keyring-core.workspace = true

[[bench]]
name = "accounting"
harness = false
