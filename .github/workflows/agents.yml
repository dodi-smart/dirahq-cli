# Thin caller, copy to <repo>/.github/workflows/agents.yml
#
# ONE caller for triage, implement and assist, replacing triage.yml,
# issue-implement.yml and claude-assist.yml. Delete those three when you add
# this one; do not run both.
#
# WHY ONE FILE: each of the three old callers owned its own `issue_comment`
# trigger, so a single comment started three runs and two of them recorded as
# skipped by their own pre-filter — noise on every comment, and three files to
# keep in sync when a trigger or an `if:` needed to change, which had already
# drifted between repos. One file listening once, with three jobs, is a single
# kill-switch surface: the reserved-verb list still lives in the shared
# workflows, this just stops three copies of the trigger from disagreeing.
name: Agents
on:
  issues:
    types: [opened, reopened, labeled, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Empty `issue-number` is a clean no-op (the shared gate gets there before any
  # runner is picked); a number re-triages that issue by hand.
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue to triage. Empty does nothing.
        required: false
        default: ""
# PERMISSIONS: a called workflow can only use what its calling job grants, and a
# job that asks for more than the caller grants fails the whole run at startup.
# Each block below is the union of what the called workflow's jobs request, so it
# is also the least that works. When a shared workflow adds a permission, add it
# here too. See references/hooks.md, "Caller permissions".
jobs:
  # Triggers: apply the `agent:triage` label, or comment `@claude triage` /
  # `@claude plan`. The bare `/triage` and `/plan` forms were retired: three
  # surfaces for one action meant the exclusion guard in claude.yml had to be
  # hand-synced with this list in every repo, and it had already drifted.
  triage:
    # The reusable workflow gates internally (bots, commands, agent:no-touch),
    # but this cheap pre-filter keeps unrelated comment traffic from starting a
    # run at all. The PR review events this file subscribes to exist for the
    # assist job and must not start triage.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@claude triage') || contains(github.event.comment.body, '@claude plan')))
      || (github.event_name == 'issues' && github.event.action != 'labeled')
      || (github.event_name == 'issues' && github.event.label.name == 'agent:triage')
    uses: dodi-smart/.github/.github/workflows/issue-triage.yml@v1
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
    with:
      issue-number: ${{ inputs.issue-number }}
    # Runner: defaults to the `light` pool. Override for this repo with
    #   with: { runner-weight: heavy }              # or apple | hosted

  # Triggers: apply `agent:implement`, or comment `@claude implement`.
  #
  # Nothing happens unless the issue is PLANNED, `Triage state` must be
  # `Plan ready`. That is checked deterministically in the shared workflow,
  # before a runner is picked, and there is no override. If an issue is not
  # planned, the answer is to triage it first.
  #
  # The agent opens a DRAFT PR and never merges. A human marks it ready, which
  # is what triggers PR Review.
  implement:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent:implement')
      || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude implement'))
    uses: dodi-smart/.github/.github/workflows/issue-implement.yml@v1
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # with:
    #   runner-weight: heavy      # the default; implementing means building
    #   base-branch: develop      # defaults to the repo's default branch, develop

  # THIS REPLACES claude.yml (as claude-assist.yml did). Delete claude.yml too,
  # if it is still there — it never checked `agent:no-touch`.
  assist:
    # Cheap pre-filter only. The real decision, including which verbs belong to
    # another job here, is made once, in the shared workflow.
    if: >-
      contains(github.event.comment.body, '@claude')
      || contains(github.event.review.body, '@claude')
      || contains(github.event.issue.body, '@claude')
      || contains(github.event.issue.title, '@claude')
    uses: dodi-smart/.github/.github/workflows/claude-assist.yml@v1
    secrets: inherit
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
