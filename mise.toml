# Toolchain pins for the Dira CLI (open source).
# Rust builds the capture layer (cli/* + contract); just runs the task recipes;
# node/bun run the JS release tooling (semantic-release + commitlint).
[tools]
rust = "stable"
just = "latest"
node = "24"
bun = "latest"

# Lint tools for the optional git hooks (hk.pkl) and the CI lint job. Pinned
# here so Renovate bumps them; keep hk in step with the version named in the
# `amends` and `import` lines of hk.pkl.
"aqua:jdx/hk" = "2.4.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:crate-ci/typos" = "1.50.3"
"aqua:zizmorcore/zizmor" = "1.30.1"
"aqua:gitleaks/gitleaks" = "8.30.1"

# Turn the hk git hooks on for this clone after every `mise install`
# (it runs even when nothing needed installing). CI skips it.
[hooks]
postinstall = { run = '[ -n "$CI" ] || hk install --mise', shell = "sh -c" }

[env]
RUST_BACKTRACE = "1"
# Local-only default; the daemon falls back to XDG paths when unset.
DIRA_SOCKET = "{{ env.TMPDIR | default(value='/tmp/') }}dira.sock"
