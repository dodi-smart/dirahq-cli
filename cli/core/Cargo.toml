[package]
name = "dira-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Dira capture engine: event model, accounting FSM, project resolver, local store."

[dependencies]
dira-contract.workspace = true
# `config::home_dir()`'s error type. `dira-core`'s own `Error` enum stays reserved for
# the store/config/crypto errors its callers pattern-match on; `home_dir()` is a
# leaf helper with a single failure mode, so a plain `anyhow::Result` (the pattern
# `dira`/`dirad` already use for exactly this shape of error) is a better fit than
# growing `Error` a variant nothing else needs.
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
ulid.workspace = true
thiserror.workspace = true
tracing.workspace = true
figment.workspace = true
directories.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
serde_jcs.workspace = true
base64.workspace = true
keyring.workspace = true
# `httpclient::builder()` — the one place device→cloud reqwest clients are
# constructed, so the extra-CA opt-in (DIRA_EXTRA_CA_CERTS) applies everywhere.
reqwest.workspace = true
# `keyring` installs the platform store; entries are built against whatever store
# is registered, which is `keyring-core`'s job (see `identity::keychain_entry`).
keyring-core.workspace = true

[dev-dependencies]
# `figment::Jail` (env-isolated config tests) is gated behind its `test` feature.
figment = { workspace = true, features = ["test"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true }
criterion.workspace = true

[[bench]]
name = "accounting"
harness = false
