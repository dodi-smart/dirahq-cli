# Thin caller of the shared dev-standards release workflow.
#
# WHY the shared workflow and not an inline job: the org `develop-checks`
# ruleset requires "checks / PR Checks" on every push to develop, and its only
# bypass actor is the org GitHub App. GITHUB_TOKEN can't be added as a bypass
# actor, so a push made with it is rejected (GH013). That's how v0.10.1 shipped
# without binaries: the inline backmerge job was rejected, the Release run
# failed, and build-release.yml (gated on `conclusion == 'success'`) skipped.
# The shared workflow mints the App token (GH_APP_CLIENT_ID /
# GH_APP_PRIVATE_KEY, via `secrets: inherit`) and pushes the release commit,
# the tags and the backmerge with it, the same way dirahq-cloud releases.
#
# The workflow name must stay "Release": build-release.yml listens for it with
# `workflow_run`.
name: Release

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Never cancel an in-flight release — a half-pushed tag/version commit is worse
# than waiting. Releases for different refs are still isolated.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: dodi-smart/.github/.github/workflows/release.yml@v1
    secrets: inherit
    # The union of what the called workflow requests; a caller has to grant it
    # or the run fails at startup.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      # bun runs the JS release tooling (semantic-release + plugins, pinned in
      # package.json). The Rust toolchain on ubuntu-latest is enough for
      # `cargo set-version`, which the exec step in release.config.mjs runs, so
      # only cargo-edit has to be added.
      stack: bun
      install: bun install --frozen-lockfile && cargo install cargo-edit --locked
      release-command: bun run release
      node-version: "24"
      backmerge: true
