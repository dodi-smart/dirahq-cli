# Config for typos, which hk runs. Nothing here should hide a real typo in code
# someone edits by hand. Add a word only after checking it is a false positive,
# and keep a comment saying where it appears.

[files]
extend-exclude = [
  # Lockfiles and changelogs are written by tools, so fix them upstream.
  "*.lock",
  "bun.lockb",
  "package-lock.json",
  "pnpm-lock.yaml",
  "CHANGELOG.md",
  # Vendored by the zavet adapters and regenerated by them.
  ".zavet/bin/**",
  # Generated and installed output.
  "node_modules/",
  ".next/",
  "dist/",
  "build/",
  "coverage/",
  "target/",
  # Fixtures whose bytes a test compares. The dialect fixtures are the upstream of
  # the shared zavet frontmatter fixtures and carry odd spellings on purpose.
  "cli/core/testdata/**",
]

[default]
# Long base64 runs (inlined images, certificates) read as strings of short words.
# One is a test certificate in httpclient.rs.
extend-ignore-re = ["[A-Za-z0-9+/]{40,}={0,2}"]

[default.extend-words]
# typos suggests "unparsable". Both spellings are valid. Here `unparseable` is in
# function names and in append-only .zavet records that cannot be reworded.
unparseable = "unparseable"
# The "mis-" prefix in prose ("mis-select", "mis-reads", "mis-orders").
mis = "mis"
# `driveable` in a test name, `requireds` and `asess` in identifiers, `flate` is
# the flate2 crate.
driveable = "driveable"
requireds = "requireds"
asess = "asess"
flate = "flate"
# Test data and truncated strings: b"ba", "hel…", the BA/WD SDDL aliases, SQL DELETEs.
ba = "ba"
hel = "hel"
delet = "delet"
