name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforce Conventional Commits on every PR. Lightweight — stays on
  # GitHub-hosted runners (no self-hosted fallback needed).
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # Lint install.sh: POSIX-only shellcheck plus canonical shfmt formatting.
  # Lightweight — stays on GitHub-hosted runners, same as commit-lint.
  shell-lint:
    name: Shell Lint (install.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - name: Install shfmt
        uses: taiki-e/install-action@v2
        with:
          tool: shfmt
      - name: shellcheck -s sh install.sh
        run: shellcheck -s sh install.sh
      - name: shfmt -d -s -ln posix -i 2 install.sh
        run: shfmt -d -s -ln posix -i 2 install.sh

  # Lint install.ps1: PSScriptAnalyzer at Warning severity, install.sh's Windows sibling.
  # Lightweight — stays on GitHub-hosted runners, same as shell-lint above. `shell: pwsh`
  # runs PowerShell 7+ (only what ubuntu-latest ships); install.ps1's own compatibility
  # floor is Windows PowerShell 5.1, but PSScriptAnalyzer's rules are version-agnostic
  # static analysis, so linting under pwsh here still catches what matters.
  powershell-lint:
    name: PowerShell Lint (install.ps1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - name: Invoke-ScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning -EnableExit

  # Detect online/idle self-hosted runners labeled `self-hosted,build`; fall back
  # to `ubuntu-latest` when none are available. Downstream jobs read the chosen
  # label set from `outputs.runner` via `fromJson()`.
  check-runners:
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    outputs:
      runner: ${{ steps.set-runner.outputs.use-runner }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check runner availability
        id: set-runner
        uses: dodi-smart/runner-fallback-action@v2
        with:
          organization: ${{ github.repository_owner }}
          primary-runner: "self-hosted,build"
          fallback-runner: "ubuntu-latest"
          github-token: ${{ steps.app-token.outputs.token }}
          fallback-on-error: true

  rust:
    name: Rust (capture layer)
    needs: [check-runners]
    runs-on: ${{ fromJson(needs.check-runners.outputs.runner) }}
    if: github.event.pull_request.draft == false
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      # Set up the Rust toolchain directly instead of via mise. The self-hosted
      # `build` runners don't ship rustup, so mise's `rust = "stable"` silently
      # no-ops there and `cargo` ends up missing (`cargo: command not found`).
      # Install rustup when absent, then pin stable with the components fmt/clippy need.
      - name: Set up Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: contract schema is up to date
        run: |
          cargo run -q -p dira-contract --bin emit-schema
          git diff --exit-code contract/attestation.schema.json \
            || (echo "contract/attestation.schema.json is stale — run 'just contract-schema'"; exit 1)
      - name: signing vector fixture is up to date
        run: |
          cargo run -q -p dira-core --bin sign_vector > contract/testdata/signing-vector.json
          git diff --exit-code contract/testdata/signing-vector.json \
            || (echo "signing-vector fixture is stale — run 'just vector'"; exit 1)

  # Windows build/test lane (native, not WSL): validates the named-pipe IPC transport
  # (`cli/ipc`) and everything else in the workspace on the actual target platform.
  # Independent of `rust` above (GitHub-hosted `windows-latest`, not the self-hosted
  # `build` pool) — fmt/contract-schema stay Linux-only intentionally (see module doc),
  # so this job only runs clippy + tests.
  rust-windows:
    name: Rust (windows)
    runs-on: windows-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
